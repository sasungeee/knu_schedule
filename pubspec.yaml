name: knu_schedule
description: Зручний розклад занять КНУ (Криворізький національний університет)
publish_to: "none"
version: 1.1.0+2

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^2.0.0
  http: ^1.2.2
  html: ^0.15.5
  shared_preferences: ^2.3.3
  intl: ^0.20.3
  url_launcher: ^6.3.1
  connectivity_plus: ^7.3.2
  pdf: ^3.11.1
  file_picker: ^13.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/NotoSans-Regular.ttf
    - assets/fonts/NotoSans-Bold.ttf
